name: بناء برنامج Windows

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: جلب المشروع
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت PyInstaller
        shell: pwsh
        run: python -m pip install --upgrade pip pyinstaller

      - name: بناء البرنامج التنفيذي
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "نظام الماركت المحاسبي" app.py

      - name: تثبيت Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: بناء Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: رفع ملف التثبيت
        uses: actions/upload-artifact@v4
        with:
          name: نظام-الماركت-المحاسبي-Setup
          path: installer/Setup.exe
